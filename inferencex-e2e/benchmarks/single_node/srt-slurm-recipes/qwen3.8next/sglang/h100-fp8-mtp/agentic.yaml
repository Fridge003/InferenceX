# Qwen3.8-Flash-Next FP8 AgentX on H100 via SGLang with native NEXTN MTP.
base:
  schema: 2
  name: qwen3.8next-fp8-h100-sglang-agentic
  model:
    path: hf:Qwen/Qwen3.8-Flash-Next-FP8
    container: lmsysorg/sglang:nightly-dev-cu13-20261013-7224fce1@sha256:009eafc447f47fc595ea5f9820a9d7a07a9d144f3c8b90ab8ef568f4124475a7
    precision: fp8
  resources:
    gpu_type: h100
    gpus_per_node: 8
  frontend:
    type: sglang
    enable_multiple_frontends: false
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 8
      args:
        served-model-name: Qwen/Qwen3.8-Flash-Next-FP8
        trust-remote-code: true
        tensor-parallel-size: 8
        expert-parallel-size: 8
        data-parallel-size: 1
        mem-fraction-static: 0.85
        chunked-prefill-size: 8192
        linear-attn-prefill-backend: flashinfer
        linear-attn-decode-backend: flashinfer
        mamba-ssm-dtype: float32
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        reasoning-parser: auto
        stream-interval: 50
        scheduler-recv-interval: 10
        tokenizer-worker-num: 6
        enable-metrics: true
      env:
        PYTHONNOUSERSITE: '1'
        SGLANG_ENABLE_SPEC_V2: '1'
  benchmark:
    type: custom
    command: bash /infmax-workspace/benchmarks/srt_agentic.sh
    env:
      MODEL: Qwen/Qwen3.8-Flash-Next-FP8
      # 256k-capped with-subagents corpus, within this model's context.
      WEKA_LOADER_OVERRIDE: semianalysis_cc_traces_weka_062126_256k

# One variant per point: admission is 2x CONC and the graph batch is CONC.
override_c1:
  roles:
    agg:
      args:
        max-running-requests: 2
        cuda-graph-max-bs-decode: 1
  benchmark:
    env:
      CONC: '1'

override_c4:
  roles:
    agg:
      args:
        max-running-requests: 8
        cuda-graph-max-bs-decode: 4
  benchmark:
    env:
      CONC: '4'

override_c8:
  roles:
    agg:
      args:
        max-running-requests: 16
        cuda-graph-max-bs-decode: 8
  benchmark:
    env:
      CONC: '8'

override_c12:
  roles:
    agg:
      args:
        max-running-requests: 24
        cuda-graph-max-bs-decode: 12
  benchmark:
    env:
      CONC: '12'

override_c16:
  roles:
    agg:
      args:
        max-running-requests: 32
        cuda-graph-max-bs-decode: 16
  benchmark:
    env:
      CONC: '16'
