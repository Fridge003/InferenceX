schema: 2

base:
  name: musespark-fp4-gb200-sglang-agentic-disagg
  resources:
    gpu_type: gb200
    gpus_per_node: 4
  frontend:
    type: sglang-router
    enable_multiple_frontends: false
    args:
      # Keep each conversation on the prefill worker that holds its prefix.
      prefill-policy: cache_aware
  observability:
    tachometer:
      enabled: false
  engine: sglang
  roles:
    # Decode follows the cookbook's PD decode cell: no layernorm SP or MegaMoE prefill.
    decode:
      nodes: 1
      workers: 1
      gpus: 4
      env: &env
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        # The DFlash2 draft comes from the shared Hub cache the job mounts.
        HF_HUB_CACHE: /hf_hub_cache
        HF_HUB_OFFLINE: '1'
        # Prefill hands KV to decode over MNNVL inside the rack.
        SGLANG_MOONCAKE_CUSTOM_MEM_POOL: NVLINK
        MC_FORCE_MNNVL: '1'
        NCCL_MNNVL_ENABLE: '1'
        NCCL_CUMEM_ENABLE: '1'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '3600'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '3600'
      args: &decode-args
        served-model-name: meta-models/Muse-Spark-Open-816B-A42B-NVFP4
        trust-remote-code: true
        tensor-parallel-size: 4
        expert-parallel-size: 4
        quantization: modelopt_fp4
        moe-runner-backend: flashinfer_trtllm
        kv-cache-dtype: fp8_e4m3
        swa-full-tokens-ratio: 0.1
        # DFlash2 verifies 8 tokens per step: the current token plus 7 drafts.
        speculative-algorithm: DFLASH
        speculative-draft-model-path: RadixArk/Muse-Spark-Open-DFlash2
        speculative-draft-attention-backend: fa4
        speculative-num-draft-tokens: 8
        mm-feature-transport: cpu
        reasoning-parser: muse
        tool-call-parser: muse
        disaggregation-mode: decode
        disaggregation-transfer-backend: mooncake
        mem-fraction-static: 0.88
        # 120 GB/rank of host KV: prefill's HiCache prefix store, and on decode the
        # host pool that holds retracted requests' KV when HBM runs out.
        hicache-size: 120
        watchdog-timeout: 3600
        enable-metrics: true
    # Prefill keeps the aggregated recipe's prefill path and its 120 GB/rank HiCache prefix store.
    prefill:
      nodes: 1
      workers: 1
      gpus: 4
      env: *env
      args:
        <<: *decode-args
        disaggregation-mode: prefill
        enable-layernorm-sp: true
        enable-megamoe-for-layernorm-sp: true
        disable-prefill-cuda-graph: true
        cuda-graph-max-bs-decode: 8
        enable-hierarchical-cache: true
  health_check:
    max_attempts: 1440
    interval_seconds: 10
  benchmark:
    env:
      # The gated Hub repo is unreadable to the client; use the staged checkpoint.
      TOKENIZER: /model
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      AGENTIC_WARMUP_GRACE_PERIOD: '3600'
      # The SGLang router has no Dynamo session routing.
      AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: '0'
  sbatch_directives:
    mem: '0'
  srun_options:
    mem: '0'

# One TP4 prefill worker keeps about 32 sessions' prefixes hot; one TP4 decode
# worker's KV pool holds about 64 sessions. Size the P:D ratio to the concurrency.
# A 1P1D pair is decode-KV bound from c32. A smaller SWA pool (40 running requests
# need ~90K window tokens) leaves more of decode HBM to full-attention KV.
override_1p1d_p-tp4_d-tp4:
  roles:
    decode:
      args:
        swa-full-tokens-ratio: 0.05
        max-running-requests: 40
        cuda-graph-max-bs-decode: 40

# KV moves between equal TP sizes only. TP8 halves the weights per GPU; SGLang sizes
# the target KV pool without the matching DFlash draft pool or the cross-node MegaMoE
# buffer, so both roles cap it at 10M tokens.
override_1p1d_p-tp8_d-tp8:
  roles:
    prefill:
      nodes: 2
      gpus: 8
      args:
        tensor-parallel-size: 8
        expert-parallel-size: 8
        max-total-tokens: 10000000
    decode:
      nodes: 2
      gpus: 8
      args:
        tensor-parallel-size: 8
        expert-parallel-size: 8
        max-total-tokens: 10000000
        max-running-requests: 160
        cuda-graph-max-bs-decode: 160

override_2p1d_p-tp4_d-tp4:
  roles:
    prefill:
      nodes: 2
      workers: 2
    decode:
      args:
        max-running-requests: 64
        cuda-graph-max-bs-decode: 64

override_3p2d_p-tp4_d-tp4:
  roles:
    prefill:
      nodes: 3
      workers: 3
    decode:
      nodes: 2
      workers: 2
      args:
        max-running-requests: 64
        cuda-graph-max-bs-decode: 64

# Prefill prefix capacity bounds sessions per pair, and decode nodes' host DRAM is
# mostly idle. Mooncake stores on the decode nodes give prefill an L3 HiCache tier
# behind its 120 GB/rank host tier; decode keeps a smaller host pool for retraction.
override_1p1d_p-tp8_d-tp8_l3:
  services:
    - name: mooncake-master
      type: mooncake-master
    - &store
      name: store-decode-0
      type: mooncake-store
      placement:
        node: decode
      args: ["--port", "8800"]
      env:
        MOONCAKE_PROTOCOL: rdma
        MOONCAKE_DEVICE: "@fabric.rdma-devices"
        MOONCAKE_GLOBAL_SEGMENT_SIZE: 110gb
        MC_TCP_BIND_ADDRESS: "{node_ip}"
      preamble: |
        ulimit -n 1048576
        ulimit -l unlimited
      readiness:
        port: 8800
        timeout_seconds: 600
    - <<: *store
      name: store-decode-1
      args: ["--port", "8801"]
      readiness:
        port: 8801
        timeout_seconds: 600
    - <<: *store
      name: store-decode-2
      args: ["--port", "8802"]
      readiness:
        port: 8802
        timeout_seconds: 600
    - <<: *store
      name: store-decode-3
      args: ["--port", "8803"]
      readiness:
        port: 8803
        timeout_seconds: 600
  roles:
    prefill:
      nodes: 2
      gpus: 8
      env:
        MOONCAKE_PROTOCOL: rdma
        MOONCAKE_DEVICE: "@fabric.rdma-devices"
        MOONCAKE_GLOBAL_SEGMENT_SIZE: '0'
        MC_TCP_BIND_ADDRESS: "{node}"
      args:
        tensor-parallel-size: 8
        expert-parallel-size: 8
        max-total-tokens: 10000000
        hicache-storage-backend: mooncake
    decode:
      nodes: 2
      gpus: 8
      args:
        tensor-parallel-size: 8
        expert-parallel-size: 8
        max-total-tokens: 10000000
        max-running-requests: 192
        cuda-graph-max-bs-decode: 192
        hicache-size: 40
