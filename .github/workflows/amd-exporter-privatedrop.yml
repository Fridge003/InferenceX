name: AMD exporter private drop

# Converts AMD's private high-resolution device-metrics-exporter image (a `docker save`
# archive held as a DRAFT release asset, visible only to collaborators) into an Enroot
# squash and stores the squash beside it. No GHCR push, no public artifact: the image is
# AMD's private drop and must not leave the draft release.

on:
  # Dispatch by file name only resolves workflows on the default branch, so the test
  # branch runs this on push; the job skips itself until the draft release exists.
  push:
    branches: [feat/powerx-amd-highres-privatedrop]
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Draft release tag holding device-metrics-exporter-latest.tar.gz"
        required: true
        default: amd-dme-highres-privatedrop-20261008
        type: string

permissions:
  contents: read

concurrency:
  group: amd-exporter-privatedrop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  squash:
    name: Convert the private drop to an Enroot squash on CPU
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Draft release assets are readable and writable only with write access.
      packages: write # Publish the image to the repository-linked GHCR package.
    timeout-minutes: 40
    env:
      ARCHIVE_NAME: device-metrics-exporter-latest.tar.gz
      ARCHIVE_SHA256: 183a796231f159dc172cb1c95a50c9d332f0ab22e33215b0f298b160e91c2edf
      DROP_TAG: registry.test.pensando.io:5000/device-metrics-exporter:latest
      IMAGE_CONFIG_ID: sha256:bb0ffcde637f2ff05c5b2118e19445f9663d7418aa6affbd202d54a0a78880b7
      LOCAL_TAG: amd-dme-highres:privatedrop-20261008
      SQSH_NAME: amd-exporter-highres-20261008.sqsh
      # Collection pulls this tag from the public package that also holds the patched build it replaces.
      # AMD's version label, the feature, and the drop date; the earlier highres-privatedrop-20261008
      # tag points at the same digest.
      GHCR_REF: ghcr.io/semianalysisai/amd-device-metrics-exporter:v1.5.4-highres-20261008
      # The image manifest the clusters pin; every tag this workflow writes must resolve to it.
      PUBLISHED_DIGEST: sha256:0d1c32c965f955b0fbf1dc87a84f7205be9019ce8d2fdf1eb929de28c71cec54
      ENROOT_PACKAGE: enroot_4.2.0-1_amd64.deb
      ENROOT_PACKAGE_SHA256: 50bfcf8336bfe1a5d19481081d7800ae80300a27795595757f7d20957e079a62
      WORK: ${{ github.workspace }}/.privatedrop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the archive from the draft release
        id: download
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag || 'amd-dme-highres-privatedrop-20261008' }}
        run: |
          set -eo pipefail
          mkdir -p "$WORK"
          if ! python3 .github/scripts/draft_release_asset.py --tag "$RELEASE_TAG" --list; then
            echo "::notice::draft release $RELEASE_TAG does not exist yet; nothing to convert"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python3 .github/scripts/draft_release_asset.py --tag "$RELEASE_TAG" --find "$SQSH_NAME" > /dev/null 2>&1; then
            echo "::notice::$SQSH_NAME is already on the draft release; skipping the conversion"
            echo "squash_exists=true" >> "$GITHUB_OUTPUT"
          fi
          python3 .github/scripts/draft_release_asset.py --tag "$RELEASE_TAG" --find "$ARCHIVE_NAME" > "$WORK/archive-asset.json"
          asset_url=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$WORK/archive-asset.json")
          curl --fail --location --silent --show-error --output "$WORK/$ARCHIVE_NAME" \
            --header "Authorization: Bearer $GITHUB_TOKEN" --header "Accept: application/octet-stream" "$asset_url"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$WORK/$ARCHIVE_NAME" | sha256sum --check -
      - name: Load the image and check its identity
        if: steps.download.outputs.skip != 'true'
        run: |
          set -eo pipefail
          docker load --input "$WORK/$ARCHIVE_NAME"
          loaded=$(docker image inspect "$DROP_TAG" --format '{{.Id}}')
          test "$loaded" = "$IMAGE_CONFIG_ID"
          docker tag "$DROP_TAG" "$LOCAL_TAG"
          docker image inspect "$LOCAL_TAG" > "$WORK/image-inspect.json"
          docker run --rm --entrypoint /home/amd/bin/server "$LOCAL_TAG" --version > "$WORK/version.txt" 2>&1 || \
            echo "version probe unavailable on CPU: $(tail -n 1 "$WORK/version.txt")"
          cat "$WORK/version.txt"
      - name: Convert to an Enroot squash
        if: steps.download.outputs.skip != 'true' && steps.download.outputs.squash_exists != 'true'
        run: |
          set -eo pipefail
          curl --fail --location --output "$WORK/$ENROOT_PACKAGE" \
            "https://github.com/NVIDIA/enroot/releases/download/v4.2.0/$ENROOT_PACKAGE"
          printf '%s  %s\n' "$ENROOT_PACKAGE_SHA256" "$WORK/$ENROOT_PACKAGE" | sha256sum --check -
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools "$WORK/$ENROOT_PACKAGE"
          enroot import --output "$WORK/$SQSH_NAME" "dockerd://$LOCAL_TAG"
          unsquashfs -s "$WORK/$SQSH_NAME"
          python3 - "$WORK" <<'PY'
          import hashlib, json, os, sys
          work = sys.argv[1]
          inspect = json.load(open(os.path.join(work, "image-inspect.json")))[0]
          sqsh = os.path.join(work, os.environ["SQSH_NAME"])
          with open(sqsh, "rb") as handle:
              sqsh_sha = hashlib.file_digest(handle, "sha256").hexdigest()
          json.dump({
              "archive": {"name": os.environ["ARCHIVE_NAME"], "sha256": os.environ["ARCHIVE_SHA256"]},
              "image": {
                  "config_id": inspect["Id"], "created": inspect["Created"],
                  "labels": {k: inspect["Config"]["Labels"].get(k) for k in ("version", "release", "vcs-ref", "ROCM_VERSION")},
                  "env": inspect["Config"]["Env"], "entrypoint": inspect["Config"]["Entrypoint"],
              },
              "squash": {"name": os.environ["SQSH_NAME"], "sha256": sqsh_sha},
              "workflow": {"run_id": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "sha": os.environ["GITHUB_SHA"]},
          }, open(os.path.join(work, "provenance.json"), "w"), indent=2)
          print("squash sha256", sqsh_sha)
          PY
          cd "$WORK"
          sha256sum "$SQSH_NAME" provenance.json > SHA256SUMS
          cat SHA256SUMS
      - name: Store the squash on the draft release
        if: steps.download.outputs.skip != 'true' && steps.download.outputs.squash_exists != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag || 'amd-dme-highres-privatedrop-20261008' }}
        run: |
          set -eo pipefail
          for name in "$SQSH_NAME" SHA256SUMS provenance.json; do
            python3 .github/scripts/draft_release_asset.py --tag "$RELEASE_TAG" --put "$WORK/$name" --name "$name"
          done
          python3 .github/scripts/draft_release_asset.py --tag "$RELEASE_TAG" --list
      - name: Publish the image to GHCR
        if: steps.download.outputs.skip != 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag || 'amd-dme-highres-privatedrop-20261008' }}
        run: |
          set -eo pipefail
          repo=${GHCR_REF%%:*}; repo=${repo#ghcr.io/}; tag=${GHCR_REF##*:}
          accept="application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          registry_token=$(curl --fail --silent --show-error --user "$GITHUB_ACTOR:$GHCR_TOKEN" \
            "https://ghcr.io/token?scope=repository:$repo:pull,push" | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])')
          resolve() { # digest a reference currently resolves to, empty when absent
            curl --silent --head --header "Authorization: Bearer $registry_token" --header "Accept: $accept" \
              "https://ghcr.io/v2/$repo/manifests/$1" | grep -i '^docker-content-digest:' | cut -d' ' -f2 | tr -d '\r'
          }
          if [ "$(resolve "$tag")" = "$PUBLISHED_DIGEST" ]; then
            echo "::notice::$GHCR_REF already resolves to $PUBLISHED_DIGEST"
          elif [ "$(resolve "$PUBLISHED_DIGEST")" = "$PUBLISHED_DIGEST" ]; then
            # The manifest is already in the registry: write the same bytes under this tag, so the
            # tag keeps the pinned digest (buildx imagetools would wrap it in an index instead).
            curl --fail --silent --show-error --output "$WORK/manifest.json" --dump-header "$WORK/manifest.headers" \
              --header "Authorization: Bearer $registry_token" --header "Accept: $accept" \
              "https://ghcr.io/v2/$repo/manifests/$PUBLISHED_DIGEST"
            media_type=$(grep -i '^content-type:' "$WORK/manifest.headers" | tail -n 1 | cut -d' ' -f2 | tr -d '\r')
            curl --fail --silent --show-error --request PUT --data-binary "@$WORK/manifest.json" \
              --header "Authorization: Bearer $registry_token" --header "Content-Type: $media_type" \
              "https://ghcr.io/v2/$repo/manifests/$tag"
          else
            docker tag "$LOCAL_TAG" "$GHCR_REF"
            docker push "$GHCR_REF"
          fi
          resolved=$(resolve "$tag")
          if [ "$resolved" != "$PUBLISHED_DIGEST" ]; then
            echo "::error::$GHCR_REF resolves to '$resolved', expected $PUBLISHED_DIGEST"
            exit 1
          fi
          printf '%s@%s\n' "ghcr.io/$repo" "$resolved" > "$WORK/ghcr-digest.txt"
          cat "$WORK/ghcr-digest.txt"
          printf '### GHCR\n`%s` = `%s`\n' "$GHCR_REF" "$resolved" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/draft_release_asset.py --tag "$RELEASE_TAG" --put "$WORK/ghcr-digest.txt" --name ghcr-digest.txt
